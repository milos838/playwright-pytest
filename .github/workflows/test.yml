name: Playwright Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      
      - name: Display Python version
        run: python -c "import sys; print(sys.version)"
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      
      - name: Install Playwright browsers
        run: |
          playwright install chromium
          playwright install-deps chromium
      
      - name: Run smoke tests
        run: pytest -m smoke -v --tb=short
        continue-on-error: true
      
      - name: Run all tests
        if: always()
        run: pytest -v --tb=short --html=report.html --self-contained-html
        continue-on-error: true
      
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: pytest-report-${{ matrix.python-version }}
          path: report.html
          retention-days: 30
      
      - name: Publish test results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: report.html
          check_name: Test Results (Python ${{ matrix.python-version }})
        continue-on-error: true

  smoke-tests:
    name: Smoke Tests (Quick Check)
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      
      - name: Install Playwright browsers
        run: |
          playwright install chromium
          playwright install-deps chromium
      
      - name: Run smoke tests
        run: pytest -m smoke -v
      
      - name: Upload smoke test logs
        if: failure()
        uses: actions/upload-artifact@v3
        with:
          name: smoke-test-logs
          path: .pytest_cache/
          retention-days: 7

  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pylint flake8
      
      - name: Lint with flake8
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 Tests/ --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats all errors as warnings
          flake8 Tests/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
        continue-on-error: true
      
      - name: Lint with pylint
        run: |
          pylint Tests/ --disable=all --enable=E,F || true
        continue-on-error: true

  summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [test, smoke-tests]
    if: always()
    
    steps:
      - name: Test job status
        run: |
          echo "Test Suite Results:"
          echo "==================="
          echo "Full test matrix: ${{ needs.test.result }}"
          echo "Smoke tests: ${{ needs.smoke-tests.result }}"
          echo "==================="
          if [[ "${{ needs.test.result }}" == "failure" || "${{ needs.smoke-tests.result }}" == "failure" ]]; then
            echo "⚠️ Some tests failed - check artifacts for details"
            exit 1
          else
            echo "✅ All tests passed!"
          fi
