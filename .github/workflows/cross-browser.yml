name: Cross-Browser Tests

on:
  schedule:
    # Run every Monday and Friday at 6 AM UTC
    - cron: '0 6 * * 1,5'
  workflow_dispatch:  # Allow manual triggering

jobs:
  cross-browser-tests:
    name: ${{ matrix.browser }} Browser Tests
    runs-on: ubuntu-latest
    env:
      EVENTHUB_USERNAME: ${{ secrets.EVENTHUB_USERNAME }}
      EVENTHUB_PASSWORD: ${{ secrets.EVENTHUB_PASSWORD }}
    
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
        python-version: ['3.11']
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      
      - name: Install Playwright browsers
        run: |
          playwright install ${{ matrix.browser }}
          playwright install-deps ${{ matrix.browser }}
      
      - name: Run smoke tests on ${{ matrix.browser }}
        run: pytest -n auto -m smoke -v --browser=${{ matrix.browser }}
      
      - name: Run all tests on ${{ matrix.browser }}
        if: always()
        run: pytest -n auto -v --browser=${{ matrix.browser }} --html=report-${{ matrix.browser }}.html --self-contained-html
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cross-browser-results-${{ matrix.browser }}
          path: report-${{ matrix.browser }}.html
          retention-days: 30
